<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width = device-width, initial-scale = 1.0" />
    <link href="Bai 5.css" rel="stylesheet" />
  </head>
  <body>
    <section class="feedback-container">
      <h2 class="form-title">Ý Kiến Phản Hồi tới Nha Sỹ</h2>
      <form>
        <div class="field">
          <label for="name">Họ và tên</label>
          <input type="text" placeholder="Họ và tên" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" placeholder="Email" />
        </div>
        <div class="field">
          <label for="field">Phản hồi của bạn</label>
          <textarea row="5" placeholder="Nhập ý kiến của bạn..."></textarea>
        </div>
        <button type="submit" class="btn-send">Gửi ý kiến</button>
      </form>
    </section>
  </body>
</html>

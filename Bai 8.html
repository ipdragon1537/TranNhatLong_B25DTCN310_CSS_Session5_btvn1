<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors Example</title>
    <style>
        /* Reset cơ bản */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* 1. Thanh tiêu đề màu xanh lá (Header) */
        header {
            background-color: #4CAF50; /* Màu xanh lá như hình */
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: normal;
        }

        /* 2. Thanh Menu màu vàng (Nav) */
        nav {
            background-color: #d4ac0d; /* Màu vàng đậm */
            padding: 10px 0;
            text-align: center;
        }

        nav a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-size: 16px;
        }

        /* Hiệu ứng chọn (Home) màu xanh nhạt */
        nav a.active {
            background-color: #aed6f1;
            color: #1b4f72;
            padding: 5px 15px;
            border-radius: 2px;
        }

        /* 3. Phần nội dung chính (Main) */
        main {
            padding: 30px 50px;
            background-color: white;
            min-height: 200px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #333;
        }

        .section p {
            margin: 0;
            color: #444;
            font-size: 14px;
        }

        /* 4. Chân trang màu đen (Footer) */
        footer {
            background-color: #333;
            color: #ccc;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CSS Selectors Example</h1>
    </header>

    <nav>
        <a href="#" class="active">Home</a>
        <a href="#">About</a>
        <a href="#">Example</a>
    </nav>

    <main>
        <div class="section">
            <h2>Introduction</h2>
            <p>Welcome to the world of CSS selectors!</p>
        </div>

        <div class="section">
            <h2>About Us</h2>
            <p>Here we will learn how to apply CSS selectors effectively.</p>
        </div>
    </main>

    <footer>
        &copy; 2025 CSS Selectors Example
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Card Sản Phẩm - Tổng Hợp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .product-container {
            display: flex;
            padding: 20px;
        }
        .product-card {
            width: 280px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-1 { background-color: rgb(224, 247, 250); }
        .card-2 { background-color: hsl(200, 30%, 92%); }
        .card-3 { background-color: rgb(232, 245, 233); }
        .product-card h2 {
            font-family: 'Verdana', sans-serif;
            font-size: 22px;
            color: #2c3e50;
            margin: 15px 0 10px;
        }
        .product-card p {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #e67e22;
            font-size: 18px;
        }
        .btn-buy {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-buy::before {
            content: "\f291";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-right: 8px;
        }
        .btn-buy:hover {
            background-color: #2980b9;
        }
        .product-card[data-sale="true"] {
            border: 2px solid #e74c3c;
            transform: scale(1.05);
        }
        .product-card + .product-card {
            margin-left: 25px;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <div class="product-card card-1" data-sale="true">
            <img src="https://picsum.photos/id/20/300/200" alt="Sản phẩm 1">
            <h2>Sản phẩm 1</h2>
            <p>Giá: 500.000đ</p>
            <button class="btn-buy">Mua ngay</button>
        </div>
        <div class="product-card card-2">
            <img src="https://picsum.photos/id/1/300/200" alt="Sản phẩm 2">
            <h2>Sản phẩm 2</h2>
            <p>Giá: 350.000đ</p>
            <button class="btn-buy">Mua ngay</button>
        </div>
        <div class="product-card card-3" data-sale="true">
            <img src="https://picsum.photos/id/26/300/200" alt="Sản phẩm 3">
            <h2>Sản phẩm 3</h2>
            <p>Giá: 800.000đ</p>
            <button class="btn-buy">Mua ngay</button>
        </div>
    </div>
</body>
</html>

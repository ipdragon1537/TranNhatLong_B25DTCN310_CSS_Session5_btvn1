<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nha Khoa Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section class="doctor-section">
        <h2 class="title">Đội Ngũ Bác Sĩ</h2>
        <div class="card">
          <div class="image-container">
            <img src="link-anh-bac-si.png" alt="Bác sĩ A" />
          </div>
          <div class="info">
            <h3 class="name">Bác sĩ A</h3>
            <p class="specialty">Chuyên khoa Nha khoa tổng quát</p>
          </div>
        </div>
      </section>

      <section class="service-section">
        <h2 class="title">Dịch Vụ Nha Khoa</h2>
        <ul class="service-list">
          <li>Khám và tư vấn răng miệng tổng quát</li>
          <li>Tẩy trắng răng</li>
          <li>Niềng răng thẩm mỹ</li>
        </ul>
      </section>
    </div>
  </body>
</html>
